<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Chest radiograph">
  <defs>
    <radialGradient id="stage" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#101826"/>
      <stop offset="100%" stop-color="#05080f"/>
    </radialGradient>
    <radialGradient id="lung" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#243246" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#243246" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="heart" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#5a6883" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#5a6883" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8893ad"/>
      <stop offset="100%" stop-color="#566179"/>
    </linearGradient>
  </defs>

  <rect width="100" height="120" fill="url(#stage)"/>

  <!-- soft tissue / lung fields -->
  <ellipse cx="32" cy="64" rx="20" ry="30" fill="url(#lung)"/>
  <ellipse cx="68" cy="64" rx="20" ry="30" fill="url(#lung)"/>

  <!-- heart + mediastinum silhouette (lower-centre, patient's left) -->
  <ellipse cx="44" cy="72" rx="15" ry="17" fill="url(#heart)"/>

  <!-- spine -->
  <g stroke="#6b7790" stroke-width="0.5" opacity="0.55" fill="none">
    <path d="M50 14 L50 104"/>
    <path d="M45 24 H55 M45 34 H55 M45 44 H55 M45 54 H55 M45 64 H55 M45 74 H55 M45 84 H55 M45 94 H55"/>
  </g>

  <!-- clavicles -->
  <g stroke="url(#bone)" stroke-width="1.6" fill="none" stroke-linecap="round" opacity="0.8">
    <path d="M28 24 Q40 18 49 23"/>
    <path d="M72 24 Q60 18 51 23"/>
  </g>

  <!-- ribcage -->
  <g stroke="#7c87a1" stroke-width="0.9" fill="none" opacity="0.5" stroke-linecap="round">
    <path d="M48 30 Q26 30 19 50"/>
    <path d="M48 40 Q24 41 17 62"/>
    <path d="M48 50 Q24 52 18 74"/>
    <path d="M48 60 Q26 64 22 84"/>
    <path d="M48 70 Q30 76 27 92"/>
    <path d="M52 30 Q74 30 81 50"/>
    <path d="M52 40 Q76 41 83 62"/>
    <path d="M52 50 Q76 52 82 74"/>
    <path d="M52 60 Q74 64 78 84"/>
    <path d="M52 70 Q70 76 73 92"/>
  </g>

  <!-- diaphragm domes -->
  <g stroke="#7c87a1" stroke-width="1" fill="none" opacity="0.55">
    <path d="M18 96 Q33 86 49 96"/>
    <path d="M51 98 Q66 88 82 96"/>
  </g>

  <!-- faint vascular markings in the lungs -->
  <g stroke="#3a4761" stroke-width="0.5" fill="none" opacity="0.6" stroke-linecap="round">
    <path d="M40 56 Q33 62 28 72"/>
    <path d="M40 58 Q34 66 31 80"/>
    <path d="M60 56 Q67 62 72 72"/>
    <path d="M60 58 Q66 66 69 80"/>
  </g>
</svg>
